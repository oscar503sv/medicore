[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medicore"
version = "0.1.0"
description = "Medicore — multi-tenant clinical management system (Clean Architecture)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Oscar" }]
dependencies = [
    # Infraestructura (fase 3)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",      # adaptador PostgreSQL (psycopg3)
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "passlib>=1.7",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["medicore.domain"]
